<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
     Number 1= <input type="number" id="num1"><br><br>
     number 2=<input type="number" id="num2"><br><br>
     <button onclick="operation('add')">Add</button><br>
      <button onclick="operation('sub')">sub</button><br>
       <button onclick="operation('mul')"> mul</button><br>
       <p id="res"></p>

       <script>
         
         
            function operation(operator){
    let a=parseInt(document.getElementById("num1").value);
        let b=parseInt(document.getElementById("num2").value); 
        let res;  
        if (operator =="add"){
            res=a+b;
        }
          
        else if(operator =='sub'){
            res=a-b;
        }
          else if(operator =='mul'){
            res=a*b;
        }
        else{
             res="invalid operator";
             return;
        }

    
//    document.getElementById("res").innerHTML=`${a} ${operator} ${b} ${res}`;     
        


    }



       </script>

</body>
