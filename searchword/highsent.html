<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .btn{
            background-color: rgb(100, 149, 237);
            color: aquamarine;
            transition: 4s;

        }
        .td{
            font-size: 19px;
            font-family: 'times new roman',times,serif;

        }
        .bgc{
            background-color: yellow;
        }
    </style>


    </head>
    <body>


<table>
    <tr>
        <h1 style="text-align: center;margin-left: 5%;">search highlighting</h1>
        
    </tr>
    <tr> 
        <td>enter a paragraph:</td>
    <td><div id="edit" contenteditable="true"></div></td>
    </tr>
    <tr>
        <td>&nbsp;</td>
        <td>&nbsp;</td>
    </tr>
    <tr>
        <td>search value &nbsp;:</td>
        <td><label for=""><input type="text" id="data" size="25"></label></td>&nbsp;

    </tr>
    <!-- <tr>
          <td>&nbsp;</td>
        <td>&nbsp;</td>
    </tr> -->
    <tr>
        <td><input type="button" onclick="rever()" value="search" class="btn"></td>
</tr>

</table>
<script>
    function rever(){
        let val=document.getElementById("edit");
        let fuld =val.innerHTML;

        let data=document.getElementById("data").value;

        let regexpr=new RegExp(`(${data})`,`gi`);

        let hd=fuld.replace(regexpr,`<span class="bgc">$1</span>`);
        val.innerHTML=hd;
     }
    </script>



    
</body>
</html>
