<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3 id="student"></h3>
    <script>
        function fetchdata(){
            fetch("https://jsonplaceholder.typicode.com/todos")
            .then(res=>{
                return res.json()

            })
            .then(data=>{
                console.log(data)
                data.map(ele=>{
                    document.getElementById("student").innerHTML+=`<li>id:${ele.id} completed:${ele.completed}</li>`
                })
            })
            .catch(err=>{
                console.log(err)
            })
        }
        fetchdata()
    </script>
</body>
</html>
