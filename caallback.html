<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function delayedcallback(callback,delay){
            setTimeout(function(){
                callback()

            },delay
        )
        }
        function mycallback(){
            alert("call back executed successfully")
        }
        delayedcallback(mycallback,5000)
    </script>
</body>
</html>
