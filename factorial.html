<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    enter the number:<input type="text" id="num">
    <button onclick="fact()"> find</button>
     <p id="res"></p>

     <script>
         function fact(){
        let n = parseInt(document.getElementById("num").value)
        let fact=1;
        for(i=1;i<=n;i++){
            fact*=i;
        }
        document.getElementById("res").innerHTML=fact;
       

        
        }

     </script>
</body>
</html>
