<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" placeholder="enter the value" id="num">
    <button onclick="convertlist()"> click here</button>

    <h3>Array listed:</h3>
    <ul id="ll"></ul>

    <script>
        let myarray=[]
        function convertlist(){
              let n=document.getElementById("num").value
              console.log(n);
              
              myarray.push(Number(n))
              displayer()
              document.getElementById("num").value=''
            }

            function displayer(){
                 let list=document.getElementById("ll")
                 list.innerHTML=""

                 myarray.forEach(function(nz){
                    let listitem=document.createElement("li")
                    listitem.textContent=nz
                    console.log(listitem);
                    list.appendChild(listitem)
                    listitem.style.listStyle="upper-roman"
                 } )
            }
    </script>
    
</body>
</html>
